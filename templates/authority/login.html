
{% extends "base.html" %}

{% block content %}

<style>
.auth-container {
    max-width: 420px;
    margin: 30px auto;
    padding: 30px;
    background: white;
    border-radius: 12px;
    box-shadow: 0 4px 15px #0002;
}

.auth-container h2 {
    text-align: center;
    margin-bottom: 25px;
}

.auth-container button {
    width: 100%;
}
</style>

<div class="auth-container">

    <h2>Login</h2>

    {% if error %}
        <p style="color:red;">{{ error }}</p>
    {% endif %}

    <form method="POST" action="{{ url_for('login') }}">

        <label>Email</label>
        <input type="email"
               name="email"
               placeholder="Enter your email"
               required>

        <label>Password</label>
        <input type="password"
               name="password"
               placeholder="Enter your password"
               required>

        <button type="submit">Login</button>

    </form>

    <p>
        Don't have an account?
        <a href="{{ url_for('signup') }}">Create Account</a>
    </p>

</div>

{% endblock %}
